# config/strategy_config.yaml 文件内容
# 股票量化策略配置文件
# 注意：所有数值均为示例，请根据实际情况调整

# 策略配置
strategies:
  # 动态CCI策略
  cci_strategy:
    enabled: true
    description: "动态CCI趋势跟踪策略"

    # CCI参数
    parameters:
      period: 80                    # CCI计算周期
      base_threshold: 130           # 基础阈值
      calibration_days: 200         # 校准天数
      time_decay_start: 20          # 时间衰减开始周期
      time_decay_rate: 0.01         # 时间衰减率

    # 信号参数
    signals:
      buy_threshold: 0              # 买入信号阈值（上穿）
      sell_threshold: 0             # 卖出信号阈值（下穿）
      exit_threshold: 100           # 退出阈值

    # 仓位管理
    position:
      max_position_ratio: 0.8       # 最大仓位比例
      base_position_size: 0.3       # 基础仓位比例
      min_position_size: 0.1        # 最小仓位比例

    # 止盈止损
    risk:
      stop_loss_pct: 0.05           # 止损比例 5%
      take_profit_pct: 0.15         # 止盈比例 15%
      trailing_stop_pct: 0.03       # 移动止损比例 3%

  # MACD策略（备用）
  macd_strategy:
    enabled: false
    description: "MACD金叉死叉策略"
    parameters:
      fast_period: 12
      slow_period: 26
      signal_period: 9

# 交易标的
symbols:
  - code: "000001.SZ"              # 平安银行
    name: "平安银行"
    enabled: true
    weight: 0.3                     # 持仓权重

  - code: "000858.SZ"              # 五粮液
    name: "五粮液"
    enabled: true
    weight: 0.25

  - code: "300750.SZ"              # 宁德时代
    name: "宁德时代"
    enabled: true
    weight: 0.25

  - code: "600036.SH"              # 招商银行
    name: "招商银行"
    enabled: true
    weight: 0.2

# 数据配置
data:
  source: "akshare"                 # 数据源：akshare, tushare, local
  start_date: "2020-01-01"          # 起始日期
  end_date: "2023-12-31"            # 结束日期
  adjust: "hfq"                     # 复权方式：qfq前复权, hfq后复权, None不复权

  # 缓存配置
  cache:
    enabled: true
    expire_days: 7                  # 缓存过期天数

  # 更新频率
  update:
    daily: true                     # 每日更新
    intraday: false                 # 盘中更新（分钟级）

# 回测配置
backtest:
  initial_capital: 1000000          # 初始资金 100万
  benchmark: "000300.SH"           # 基准指数（沪深300）
  start_date: "2022-01-01"
  end_date: "2023-12-31"
  commission_rate: 0.0003           # 佣金费率
  stamp_tax: 0.001                  # 印花税

  # 滑点设置
  slippage:
    mode: "fixed"                   # fixed固定, random随机, percentage百分比
    value: 0.001                    # 滑点值

# 运行模式
mode: "backtest"                    # backtest回测, paper模拟, live实盘

# 调试设置
debug:
  enable_logging: true
  log_level: "INFO"                 # DEBUG, INFO, WARNING, ERROR
  save_trade_details: true
  plot_results: true